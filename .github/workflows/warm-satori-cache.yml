name: Warm Satori cache

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: >-
          Compare HTTP clients and Impit profiles without touching Redis
        type: boolean
        default: false
      backfill_since:
        description: >-
          Backfill historical days since this date
          (YYYY-MM-DD, earliest 2025-12-25)
        required: false

concurrency:
  group: >-
    ${{ inputs.diagnostics_only && 'satori-probes' || 'warm-satori-cache' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/diagnose-satori.ts
        if: ${{ inputs.diagnostics_only == true }}
      - run: pnpm exec tsx scripts/warm-satori-cache.ts
        if: ${{ inputs.diagnostics_only != true }}
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
